artifact_root: artifacts
data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: https://github.com/qosain-bukhari/End_to_end_ReD_Wine_Quality_Mlops_Project/raw/refs/heads/main/WineQT.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion


data_validation:
  root_dir: artifacts/data_validation             # Folder to store validation artifacts
  raw_data_file: artifacts/data_ingestion/WineQT.csv  # CSV file produced by data ingestion
  status_file: artifacts/data_validation/status.txt  # Status log file for validation

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/WineQT.csv


model_training:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_name: model.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_transformation/test.csv
  model_path: artifacts/model_trainer/model.joblib
  metric_file_name: metrics.json
